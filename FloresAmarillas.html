<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flores Amarillas ❤️</title>
  <style>
    :root{
      --bg: linear-gradient(135deg,#f6f7fb 0%, #eaf7ff 100%);
      --petal1: #FFEB3B; /* amarillo vibrante */
      --petal2: #FFD54F; /* dorado */
      --center: #FF8A00; /* naranja centro */
      --stem: #2E7D32; /* verde tallo */
      --leaf: #2FA14B;
      --shadow: rgba(0,0,0,0.08);
      --accent: #fff8e1;
      --font: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* Reset ligero */
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:var(--font);
      background: var(--bg);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
      color:#20313b;
    }

    /* Contenedor principal */
    .card{
      width:100%;
      max-width:980px;
      background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.98));
      border-radius:20px;
      padding:28px;
      box-shadow:0 12px 30px var(--shadow);
      display:grid;
      grid-template-columns: 1fr 420px;
      gap:20px;
      align-items:center;
    }

    .intro{
      padding:12px 18px;
    }
    h1{font-size:28px;margin-bottom:6px}
    p{color:#3b565f;line-height:1.45}

    /* Canvas de flores */
    .garden{
      background: linear-gradient(180deg,#e6fff1, #f7fff9);
      border-radius:14px;
      padding:20px;
      height:420px;
      position:relative;
      overflow:hidden;
      display:flex;
      align-items:flex-end;
      justify-content:space-around;
      box-shadow:inset 0 2px 8px rgba(0,0,0,0.02);
    }

    /* Flor base */
    .flower{
      --size:120px; /* se puede ajustar */
      width:var(--size);
      height:var(--size);
      position:relative;
      display:block;
      transform-origin:center bottom;
      animation: sway 6s ease-in-out infinite;
    }

    /* Diferentes offsets para movimiento natural */
    .flower:nth-child(1){animation-delay:0s; --size:130px}
    .flower:nth-child(2){animation-delay:0.6s; --size:110px}
    .flower:nth-child(3){animation-delay:1.2s; --size:140px}

    @keyframes sway{
      0%{transform:translateY(0) rotate(0deg)}
      25%{transform:translateY(-6px) rotate(-3deg)}
      50%{transform:translateY(0) rotate(0deg)}
      75%{transform:translateY(-6px) rotate(3deg)}
      100%{transform:translateY(0) rotate(0deg)}
    }

    /* Tallo */
    .stem{
      position:absolute;
      bottom:-40px;
      left:50%;
      transform:translateX(-50%);
      width:8px;
      height:220px;
      background:linear-gradient(180deg,var(--stem), #1b5e20);
      border-radius:8px;
      z-index:-1;
      box-shadow:0 6px 12px rgba(0,0,0,0.06);
      transition:transform .25s ease;
    }

    /* Hojas */
    .leaf{
      position:absolute;
      bottom:60px;
      width:60px;
      height:26px;
      background:linear-gradient(90deg,var(--leaf), #1b8a37);
      border-radius:40px 40px 20px 40px;
      transform-origin:left center;
      box-shadow:0 6px 10px rgba(0,0,0,0.06);
    }
    .leaf.right{right:-12px;transform:rotate(26deg)}
    .leaf.left{left:-12px;transform:rotate(-22deg)}

    /* Centro de la flor */
    .center{
      position:absolute;
      width:38%;
      height:38%;
      left:31%;
      top:31%;
      border-radius:50%;
      background:radial-gradient(circle at 30% 30%, #ffd180, var(--center));
      box-shadow:0 8px 18px rgba(255,140,0,0.12), inset 0 -4px 10px rgba(0,0,0,0.08);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#4a2f00;
      font-weight:700;
      font-size:14px;
      letter-spacing:0.6px;
    }

    /* Pétalos (6) usando pseudo-elementos rotados */
    .petal{
      --p-size:44%;
      position:absolute;
      left:50%;
      top:12%;
      transform-origin:center 90%;
      width:var(--p-size);
      height:var(--p-size);
      background:radial-gradient(circle at 30% 20%, var(--accent), var(--petal1));
      border-radius:60% 60% 40% 40%;
      box-shadow:0 8px 14px rgba(0,0,0,0.06);
      transition:transform .25s ease, box-shadow .25s ease;
    }

    /* posicionamiento rotado para 6 pétalos */
    .petal.p1{transform:translate(-50%,0) rotate(0deg) scale(1)}
    .petal.p2{transform:translate(-50%,0) rotate(60deg)}
    .petal.p3{transform:translate(-50%,0) rotate(120deg)}
    .petal.p4{transform:translate(-50%,0) rotate(180deg)}
    .petal.p5{transform:translate(-50%,0) rotate(240deg)}
    .petal.p6{transform:translate(-50%,0) rotate(300deg)}

    /* Estilos distintos para cada flor (variaciones) */
    .flower.variant-1 .petal{--petal1: #FFEB3B; --petal2:#FFEE58}
    .flower.variant-2 .petal{--petal1: #FFF176; --petal2:#FFD54F}
    .flower.variant-3 .petal{--petal1: #FFEE58; --petal2:#FFC107}

    /* Interacción */
    .flower:hover{filter:drop-shadow(0 18px 28px rgba(0,0,0,0.12)); transform:scale(1.06)}
    .flower:hover .petal{transform:scale(1.03)}

    /* Texto romántico sobre el jardín */
    .note{
      position:absolute;
      top:18px;
      left:18px;
      font-size:13px;
      background:rgba(255,255,255,0.7);
      padding:8px 12px;
      border-radius:999px;
      box-shadow:0 6px 12px rgba(0,0,0,0.04);
      backdrop-filter: blur(4px);
    }

    /* Botón para mensaje personalizado */
    .cta{
      margin-top:18px;
      display:inline-block;
      background:linear-gradient(180deg,#ffd54f,#ffb300);
      color:#2b2b2b;
      padding:10px 14px;
      border-radius:12px;
      font-weight:600;
      text-decoration:none;
      box-shadow:0 8px 20px rgba(255,165,0,0.12);
    }

    /* Responsive */
    @media (max-width:880px){
      .card{grid-template-columns:1fr;}
      .garden{height:360px}
    }

  </style>
</head>
<body>
  <div class="card">
    <div class="intro">
      <h1>Un ramo de flores amarillas 🌼</h1>
      <p>Sho amarte muchote Niña Linda </p>
      <a class="cta" href="Flores Amarillas.html" onclick="alert Si quieres Regresar">Volver al inicio</a>
      <p style="margin-top:12px;color:#2f4b50;font-size:13px">Eres la mas hermosa de mi jardin y te cuidare con mucho amor cariño y respeto </p>
    </div>

    <div class="garden" aria-label="Jardín de flores amarillas">
      <div class="note">Hecho con cariño tu niño Frank</div>

      <!-- Flor 1 -->
      <div class="flower variant-1" role="img" aria-label="Flor amarilla grande">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="center">Para ti</div>
        <div class="stem"></div>
        <div class="leaf left"></div>
        <div class="leaf right"></div>
      </div>

      <!-- Flor 2 -->
      <div class="flower variant-2" role="img" aria-label="Flor amarilla mediana">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="center">Eres luz</div>
        <div class="stem" style="height:200px; bottom:-32px"></div>
        <div class="leaf left" style="bottom:46px"></div>
        <div class="leaf right" style="bottom:56px"></div>
      </div>

      <!-- Flor 3 -->
      <div class="flower variant-3" role="img" aria-label="Flor amarilla pequeña">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="center">♥</div>
        <div class="stem" style="height:240px; bottom:-44px"></div>
        <div class="leaf left" style="bottom:80px"></div>
        <div class="leaf right" style="bottom:74px"></div>
      </div>

    </div>
  </div>
</body>
</html>
